# Local Memgraph for ops-support. Credentials and embedding-provider keys come from .env
# (see .env.example). Data is bind-mounted under ./docker/memgraph/ and survives
# `docker compose down`; delete that directory to start from an empty graph.
services:
  memgraph:
    image: memgraph/memgraph-mage:3.14.0
    container_name: memgraph-mage
    ports:
      # Loopback only: the defaults fall back to ops/ops when .env is absent.
      - "127.0.0.1:7687:7687" # Bolt
      - "127.0.0.1:7444:7444" # log streaming
    command:
      - --log-level=WARNING
      - --also-log-to-stderr
      - --storage-properties-on-edges=true
      - --data-recovery-on-startup=true
      - --storage-snapshot-interval-sec=300
      - --storage-snapshot-on-exit=true
    volumes:
      - ./docker/memgraph/lib:/var/lib/memgraph
      - ./docker/memgraph/log:/var/log/memgraph
    # The whole .env reaches Memgraph, so LiteLLM inside it sees provider keys (OPENAI_API_KEY, …).
    env_file:
      - path: .env
        required: false
    environment:
      - MEMGRAPH_USER=${MEMGRAPH_USER:-ops}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-ops}
      - HF_HOME=/var/lib/memgraph/hf-cache # model cache on the bind mount: downloads once

  lab:
    image: memgraph/lab:3.14.0 # same release as memgraph-mage; pinned like it
    container_name: memgraph-lab
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - memgraph
    # Lab's quick-connect is anonymous-only (no username/password setting), and Memgraph has auth on,
    # so it would fail every 2 s. Log in via "Connect manually": host memgraph, port 7687, and
    # MEMGRAPH_USER / MEMGRAPH_PASSWORD from .env.
    environment:
      - QUICK_CONNECT_IS_DISABLED=true
